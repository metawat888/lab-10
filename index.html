<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Electrical Lab</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Custom animations extracted from component */
        @keyframes flow { to { stroke-dashoffset: -30; } }
        .wire-flow { 
            stroke-dasharray: 6 12; 
            animation: flow var(--speed, 1s) linear infinite; 
        }
        body {
            background-color: #f1f5f9; /* slate-100 */
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- INLINE ICONS (Replacing lucide-react for standalone usage) ---
        const Zap = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>;
        const Activity = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>;
        const Gauge = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 14 4-4"/><path d="M3.34 16A10 10 0 1 1 20.66 16"/></svg>;
        const Box = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>;
        const Microscope = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 18h8"/><path d="M3 22h18"/><path d="M14 22a7 7 0 1 0 0-14h-1"/><path d="M9 14h2"/><path d="M9 12a2 2 0 0 1-2-2V6h6v4a2 2 0 0 1-2 2Z"/><path d="M12 6V3a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v3"/></svg>;
        const Settings2 = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="7" r="3"/><circle cx="7" cy="17" r="3"/></svg>;

        const ElectricalLabSimulation = () => {
          // --- CONFIGURATION ---
          const AMMETER_RANGES = [
            { label: '2 mA', max: 0.002, unit: 'mA', displayMult: 1000, step: 0.0001 },
            { label: '100 mA', max: 0.1, unit: 'mA', displayMult: 1000, step: 0.001 },
            { label: '500 mA', max: 0.5, unit: 'mA', displayMult: 1000, step: 0.01 },
            { label: '5 A', max: 5, unit: 'A', displayMult: 1, step: 0.1 }
          ];

          const VOLTMETER_RANGES = [
            { label: '3 V', max: 3, unit: 'V', step: 0.1 },
            { label: '15 V', max: 15, unit: 'V', step: 0.5 },
            { label: '30 V', max: 30, unit: 'V', step: 1 },
            { label: '300 V', max: 300, unit: 'V', step: 10 }
          ];

          const OHMMETER_RANGES = [
            { label: 'x 1', multiplier: 1, mid: 15 },
            { label: 'x 10', multiplier: 10, mid: 150 },
            { label: 'x 100', multiplier: 100, mid: 1500 },
            { label: 'x 1k', multiplier: 1000, mid: 15000 }
          ];

          // --- STATE ---
          const [instrumentType, setInstrumentType] = useState('ammeter'); 
          const [selectedRangeIndex, setSelectedRangeIndex] = useState(1);
          
          // Manual Value (Instrument Mode)
          const [manualValue, setManualValue] = useState(0);

          // Physics State
          const needlePhysics = useRef({ pos: 0, vel: 0, target: 0 });
          const [needlePos, setNeedlePos] = useState(0);

          const ranges = instrumentType === 'ammeter' ? AMMETER_RANGES : (instrumentType === 'voltmeter' ? VOLTMETER_RANGES : OHMMETER_RANGES);
          const currentRange = ranges[selectedRangeIndex];

          // Reset manual value when changing instrument or range
          useEffect(() => {
            if (instrumentType === 'ohmmeter') {
              setManualValue(currentRange.mid); // Default to mid scale
            } else {
              setManualValue(0);
            }
          }, [instrumentType, selectedRangeIndex]);

          // Physics Loop
          useEffect(() => {
            if (instrumentType === 'ohmmeter') {
              const safeRes = Math.max(0, manualValue);
              const fraction = currentRange.mid / (safeRes + currentRange.mid);
              needlePhysics.current.target = fraction;
            } else {
              const targetValue = manualValue / currentRange.max;
              needlePhysics.current.target = targetValue;
            }

            let animationFrameId;
            let lastTime = performance.now();
            const animate = (time) => {
              const dt = Math.min((time - lastTime) / 1000, 0.05);
              lastTime = time;
              const tension = 160; 
              const friction = 10;
              
              const acc = (needlePhysics.current.target - needlePhysics.current.pos) * tension - (needlePhysics.current.vel * friction);
              needlePhysics.current.vel += acc * dt;
              needlePhysics.current.pos += needlePhysics.current.vel * dt;
              setNeedlePos(needlePhysics.current.pos);
              
              animationFrameId = requestAnimationFrame(animate);
            };
            animationFrameId = requestAnimationFrame(animate);
            return () => cancelAnimationFrame(animationFrameId);
          }, [manualValue, selectedRangeIndex, instrumentType, currentRange]);

          const activeNeedlePos = needlePos;
          const isOverload = activeNeedlePos > 1.05;
          const themeColor = instrumentType === 'ammeter' ? 'blue' : instrumentType === 'voltmeter' ? 'orange' : 'green';

          const renderTicks = () => {
            const ticks = [];
            const centerX = 300; const centerY = 320; const rBase = 220;
            if (instrumentType === 'ohmmeter') {
              const marks = [
                {v: 1000000, l: '∞', f: 0.0},
                {v: 500, l: '500', f: currentRange.mid / (500 + currentRange.mid)},
                {v: 100, l: '100', f: currentRange.mid / (100 + currentRange.mid)},
                {v: 50, l: '50', f: currentRange.mid / (50 + currentRange.mid)},
                {v: 30, l: '30', f: currentRange.mid / (30 + currentRange.mid)},
                {v: 15, l: '15', f: 0.5},
                {v: 10, l: '10', f: currentRange.mid / (10 + currentRange.mid)},
                {v: 5, l: '5', f: currentRange.mid / (5 + currentRange.mid)},
                {v: 0, l: '0', f: 1.0}
              ];
              marks.forEach((mark, i) => {
                const angleDeg = -50 + (mark.f * 100);
                const angleRad = (angleDeg * Math.PI) / 180;
                ticks.push(<line key={`omark-${i}`} x1={centerX + rBase * Math.sin(angleRad)} y1={centerY - rBase * Math.cos(angleRad)} x2={centerX + (rBase + 15) * Math.sin(angleRad)} y2={centerY - (rBase + 15) * Math.cos(angleRad)} stroke="black" strokeWidth="2.5" />);
                ticks.push(<text key={`otxt-${i}`} x={centerX + (rBase + 40) * Math.sin(angleRad)} y={centerY - (rBase + 40) * Math.cos(angleRad)} fill="black" fontSize="14" fontWeight="bold" textAnchor="middle" dominantBaseline="middle">{mark.l}</text>);
              });
            } else {
              for (let i = 0; i <= 50; i++) {
                const fraction = i / 50;
                const angleDeg = -50 + (fraction * 100);
                const angleRad = (angleDeg * Math.PI) / 180;
                const isMain = i % 10 === 0;
                ticks.push(<line key={`tick-${i}`} x1={centerX + rBase * Math.sin(angleRad)} y1={centerY - rBase * Math.cos(angleRad)} x2={centerX + (rBase + (isMain ? 18 : 8)) * Math.sin(angleRad)} y2={centerY - (rBase + (isMain ? 18 : 8)) * Math.cos(angleRad)} stroke="black" strokeWidth={isMain ? "2.5" : "1"} />);
                if (isMain) {
                  const val = (fraction * currentRange.max * (currentRange.displayMult || 1));
                  ticks.push(<text key={`txt-${i}`} x={centerX + (rBase + 45) * Math.sin(angleRad)} y={centerY - (rBase + 45) * Math.cos(angleRad)} fill="black" fontSize="16" fontWeight="bold" textAnchor="middle" dominantBaseline="middle">{val >= 10 ? Math.round(val) : val.toFixed(1)}</text>);
                }
              }
            }
            return ticks;
          };

          return (
            <div className="min-h-screen bg-slate-100 text-slate-800 p-4 md:p-8 font-sans flex flex-col items-center relative">
              <style>{`
                @keyframes flow { to { stroke-dashoffset: -30; } }
                .wire-flow { stroke-dasharray: 6 12; animation: flow var(--speed, 1s) linear infinite; }
              `}</style>
              
              {/* --- DEVELOPER BADGE TOP RIGHT --- */}
              <div className="absolute top-4 right-4 md:top-6 md:right-8 flex items-center gap-3 bg-white px-4 py-2 rounded-2xl shadow-md border border-slate-200 z-10">
                <img 
                  src="https://github.com/metawat888/Picture/raw/69f9d3a46e017adc43abb8db3503ea8106ecae61/97488303_2887790847941184_353651305119481856_n.jpg" 
                  alt="นายเมธาวัฒน์ พงสะพัง" 
                  className="w-10 h-10 rounded-full object-cover border-2 border-indigo-500 shadow-sm"
                  onError={(e) => { e.target.src = 'https://placehold.co/100x100/e2e8f0/475569?text=MP'; }}
                />
                <div className="hidden sm:block text-right">
                  <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest block">พัฒนาโดย</span>
                  <span className="text-xs font-bold text-slate-800">นายเมธาวัฒน์ พงสะพัง</span>
                </div>
              </div>

              <header className="mb-6 text-center mt-12 md:mt-0">
                <h1 className="text-3xl font-black text-slate-900 tracking-tight flex items-center justify-center gap-3">
                  <Zap className="text-yellow-500 fill-yellow-500" /> VIRTUAL ELECTRICAL LAB
                </h1>
                <p className="text-sm text-slate-500 mt-1 font-medium">จำลองเครื่องวัดทางไฟฟ้าและฝึกอ่านสเกลหน้าปัด</p>
              </header>

              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 w-full max-w-7xl items-start">
                
                {/* --- LEFT SIDE: INSTRUMENT CONTROLS --- */}
                <div className="lg:col-span-6 flex flex-col gap-6">
                  <div className="bg-white rounded-[2rem] p-8 shadow-2xl border border-slate-200">
                     <h3 className="text-sm font-black text-slate-400 uppercase tracking-[0.2em] mb-6 flex items-center gap-2">
                       <Settings2 className="w-4 h-4 text-slate-600" /> Instrument Config
                     </h3>
                     
                     <div className="space-y-8">
                        <div className="p-6 bg-slate-50 rounded-2xl border border-slate-100">
                          <label className="text-xs font-black text-slate-500 uppercase block mb-4">ปรับค่าที่ต้องการวัด (Direct Setting)</label>
                          <div className="flex items-center gap-6">
                            <input 
                              type="range" 
                              min="0" 
                              max={instrumentType === 'ohmmeter' ? currentRange.mid * 20 : currentRange.max * 1.1} 
                              step={instrumentType === 'ohmmeter' ? 10 : (currentRange.step || 1)}
                              value={manualValue}
                              onChange={(e) => setManualValue(parseFloat(e.target.value))}
                              className={`flex-1 h-2 rounded-lg appearance-none cursor-pointer ${
                                instrumentType === 'ammeter' ? 'accent-blue-600' : instrumentType === 'voltmeter' ? 'accent-orange-500' : 'accent-green-600'
                              } bg-slate-200`}
                            />
                            <div className="w-28 text-right font-mono font-black text-xl text-slate-800">
                              {instrumentType === 'ohmmeter' ? (manualValue > currentRange.mid * 15 ? '∞ Ω' : manualValue.toFixed(0) + ' Ω') : manualValue.toFixed(manualValue < 1 ? 3 : 1)}
                            </div>
                          </div>
                          <p className="mt-4 text-xs text-slate-400 italic">
                            * ปรับค่าเพื่อฝึกอ่านขีดสเกลบนหน้าปัดได้ตามต้องการ
                          </p>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                           <div className="p-4 bg-blue-50 rounded-xl border border-blue-100">
                              <span className="text-[10px] font-bold text-blue-400 uppercase">Selected Unit / Multiplier</span>
                              <p className="text-lg font-black text-blue-700">{currentRange.unit || currentRange.label}</p>
                           </div>
                           <div className="p-4 bg-slate-800 rounded-xl text-white">
                              <span className="text-[10px] font-bold text-slate-500 uppercase">Scale Type</span>
                              <p className="text-lg font-black">{instrumentType === 'ohmmeter' ? 'Non-linear (Reversed)' : 'Linear Scale'}</p>
                           </div>
                        </div>
                     </div>
                  </div>
                </div>

                {/* --- RIGHT SIDE: MAIN METER --- */}
                <div className="lg:col-span-6 flex flex-col items-center">
                  
                  <div className="mb-6 flex bg-white p-1.5 rounded-2xl shadow-xl border border-slate-200 w-full max-w-sm">
                    {['ammeter', 'voltmeter', 'ohmmeter'].map((id) => (
                      <button key={id} onClick={() => {setInstrumentType(id); setSelectedRangeIndex(1);}}
                        className={`flex-1 flex items-center justify-center gap-2 py-3 rounded-xl font-bold transition-all text-sm capitalize ${
                          instrumentType === id ? (id === 'ammeter' ? 'bg-blue-600' : id === 'voltmeter' ? 'bg-orange-500' : 'bg-green-600') + ' text-white shadow-lg' : 'text-slate-400 hover:bg-slate-50'
                        }`}
                      >
                        {id === 'ammeter' ? <Activity className="w-4 h-4" /> : id === 'voltmeter' ? <Gauge className="w-4 h-4" /> : <Box className="w-4 h-4" />} {id}
                      </button>
                    ))}
                  </div>

                  <div className="relative bg-[#f1f5f9] rounded-[3rem] shadow-2xl border-[12px] border-slate-400 w-full aspect-[1.1/1] flex flex-col items-center p-8">
                    <div className="relative w-full h-[65%] bg-white rounded-3xl border-4 border-slate-300 shadow-inner flex justify-center overflow-hidden">
                      <svg viewBox="0 0 600 400" className="w-full h-full p-4">
                        <path d="M 120 200 A 220 220 0 0 1 480 200" fill="none" stroke="#f1f5f9" strokeWidth="25" />
                        {renderTicks()}
                        <g transform="translate(300, 260)" textAnchor="middle">
                          <text y="0" fontSize="36" className="font-black" fill={
                            themeColor === 'blue' ? '#2563eb' : themeColor === 'orange' ? '#f97316' : '#16a34a'
                          }>{instrumentType === 'ammeter' ? 'A' : instrumentType === 'voltmeter' ? 'V' : 'Ω'}</text>
                          <text y="28" fontSize="12" fill="#94a3b8" className="font-bold tracking-widest uppercase">Practice Scale</text>
                        </g>
                        <circle cx="300" cy="320" r="18" fill="#1e293b" />
                        <g transform={`rotate(${-50 + (Math.min(Math.max(activeNeedlePos, -0.05), 1.15) * 100)}, 300, 320)`}>
                          <line x1="300" y1="330" x2="300" y2="55" stroke={isOverload ? "#ef4444" : "#1e293b"} strokeWidth="3" strokeLinecap="round" />
                        </g>
                      </svg>
                    </div>

                    <div className="w-full flex-1 mt-8 flex flex-col justify-end px-8 pb-4">
                       <div className="flex justify-between items-end">
                          <div className="w-10 h-10 rounded-full bg-slate-900 border-b-4 border-black"></div>
                          <div className="flex gap-4">
                            {ranges.map((range, idx) => (
                              <div key={idx} className="flex flex-col items-center cursor-pointer" onClick={() => setSelectedRangeIndex(idx)}>
                                <div className={`w-8 h-8 rounded-full border-b-4 shadow-xl transition-all ${
                                  selectedRangeIndex === idx ? 'bg-red-500 border-red-800 -translate-y-2' : 'bg-red-900 border-black opacity-40'
                                }`}></div>
                                <span className={`mt-2 text-[9px] font-black ${selectedRangeIndex === idx ? 'text-red-600' : 'text-slate-400'}`}>{range.label}</span>
                              </div>
                            ))}
                          </div>
                       </div>
                    </div>
                  </div>

                  <div className="mt-6 grid grid-cols-2 gap-4 w-full">
                    <div className="bg-white p-4 rounded-3xl shadow-sm border border-slate-200 text-center">
                      <p className="text-[10px] font-black text-slate-400 uppercase">Current / Resistance Reading</p>
                      <p className="text-xl font-mono font-black text-blue-600">
                        {instrumentType === 'ohmmeter' 
                         ? (manualValue > currentRange.mid * 15 ? '∞ Ω' : (manualValue * currentRange.multiplier).toLocaleString() + ' Ω')
                         : ((instrumentType === 'ammeter' ? manualValue : 0) * 1000 >= 1000 
                             ? (instrumentType === 'ammeter' ? manualValue : 0).toFixed(2) + ' A'
                             : ((instrumentType === 'ammeter' ? manualValue : 0) * 1000).toFixed(1) + ' mA'
                           )
                        }
                      </p>
                    </div>
                    <div className="bg-white p-4 rounded-3xl shadow-sm border border-slate-200 text-center">
                      <p className="text-[10px] font-black text-slate-400 uppercase">Voltage Reading</p>
                      <p className="text-xl font-mono font-black text-orange-600">
                        {(instrumentType === 'voltmeter' ? manualValue : 0).toFixed(1)} <span className="text-xs">V</span>
                      </p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ElectricalLabSimulation />);
    </script>
</body>
</html>
