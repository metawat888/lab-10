<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virtual Electrical Lab Simulation Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @keyframes auraPulse { 
            0%, 100% { opacity: 0.4; filter: drop-shadow(0 0 6px currentColor); } 
            50% { opacity: 0.9; filter: drop-shadow(0 0 14px currentColor); } 
        }
        .wire-aura { animation: auraPulse 1.5s ease-in-out infinite; }
        
        body { background-color: #0f172a; touch-action: none; overflow: hidden; overscroll-behavior: none; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        * { user-select: none; -webkit-user-select: none; }
    </style>
</head>
<body class="text-slate-100 min-h-screen">
    <div id="root" class="h-screen w-screen flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        const Zap = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>;
        const Trash2 = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>;
        const Plus = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
        const Minus = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>;
        const Maximize = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>;

        const AMMETER_RANGES = [
          { label: '100 mA', max: 0.1, unit: 'mA', displayMult: 1000 },
          { label: '5 A', max: 5, unit: 'A', displayMult: 1 },
          { label: '100 A', max: 100, unit: 'A', displayMult: 1 },
          { label: '500 A', max: 500, unit: 'A', displayMult: 1 }
        ];

        const VOLTMETER_RANGES = [
          { label: '3 V', max: 3, unit: 'V' },
          { label: '15 V', max: 15, unit: 'V' },
          { label: '30 V', max: 30, unit: 'V' },
          { label: '300 V', max: 300, unit: 'V' }
        ];

        const OHMMETER_RANGES = [
          { label: 'x 1', multiplier: 1, mid: 15 },
          { label: 'x 10', multiplier: 10, mid: 150 },
          { label: 'x 100', multiplier: 100, mid: 1500 },
          { label: 'x 1k', multiplier: 1000, mid: 15000 }
        ];

        const ScaleDialTicks = React.memo(({ instrumentType, currentRange }) => {
          const ticks = [];
          const centerX = 300; const centerY = 320; const rBase = 220;
          
          ticks.push(<path key="mirror" d="M 120 200 A 220 220 0 0 1 480 200" fill="none" stroke="#cbd5e1" strokeWidth="30" />);
          ticks.push(<path key="track" d="M 100 200 A 240 240 0 0 1 500 200" fill="none" stroke="#1e293b" strokeWidth="3" />);

          if (instrumentType === 'ohmmeter') {
            const marks = [
              {v: 1000000, l: '∞', f: 0.0}, {v: 500, l: '500', f: currentRange.mid / (500 + currentRange.mid)},
              {v: 100, l: '100', f: currentRange.mid / (100 + currentRange.mid)}, {v: 50, l: '50', f: currentRange.mid / (50 + currentRange.mid)},
              {v: 30, l: '30', f: currentRange.mid / (30 + currentRange.mid)}, {v: 15, l: '15', f: 0.5},
              {v: 10, l: '10', f: currentRange.mid / (10 + currentRange.mid)}, {v: 5, l: '5', f: currentRange.mid / (5 + currentRange.mid)},
              {v: 0, l: '0', f: 1.0}
            ];
            marks.forEach((mark, i) => {
              const angleRad = ((-50 + (mark.f * 100)) * Math.PI) / 180;
              ticks.push(<line key={`omark-${i}`} x1={centerX + rBase * Math.sin(angleRad)} y1={centerY - rBase * Math.cos(angleRad)} x2={centerX + (rBase + 15) * Math.sin(angleRad)} y2={centerY - (rBase + 15) * Math.cos(angleRad)} stroke="#0f172a" strokeWidth="2.5" />);
              ticks.push(<text key={`otxt-${i}`} x={centerX + (rBase + 35) * Math.sin(angleRad)} y={centerY - (rBase + 35) * Math.cos(angleRad)} fill="#0f172a" fontSize="16" fontWeight="900" textAnchor="middle" dominantBaseline="middle">{mark.l}</text>);
            });
          } else {
            let numMainTicks = 5;
            let scaleMax = 100;
            
            // Voltmeter Scale Logic
            if (instrumentType === 'voltmeter') {
              scaleMax = currentRange.max;
              if (scaleMax === 3 || scaleMax === 30 || scaleMax === 300) { 
                numMainTicks = 6; 
              } else { 
                numMainTicks = 5; 
              }
            } 
            // Ammeter Scale Logic (Dynamic based on range)
            else if (instrumentType === 'ammeter') {
              numMainTicks = 5; 
              scaleMax = currentRange.max * (currentRange.displayMult || 1);
            }

            const totalSubs = numMainTicks * 10; 

            for (let i = 0; i <= totalSubs; i++) {
              const fraction = i / totalSubs;
              const angleRad = ((-50 + (fraction * 100)) * Math.PI) / 180;
              const isMain = i % 10 === 0;
              const isMid = i % 5 === 0 && !isMain;
              const lineLen = isMain ? 18 : (isMid ? 12 : 7);
              
              ticks.push(<line key={`tick-${i}`} x1={centerX + rBase * Math.sin(angleRad)} y1={centerY - rBase * Math.cos(angleRad)} x2={centerX + (rBase + lineLen) * Math.sin(angleRad)} y2={centerY - (rBase + lineLen) * Math.cos(angleRad)} stroke="#0f172a" strokeWidth={isMain ? "2.5" : "1"} />);
              
              if (isMain) {
                const val = fraction * scaleMax;
                let textVal = val % 1 === 0 ? val.toString() : val.toFixed(1);
                
                // Ensure 3V scale always shows 1 decimal (0.0, 0.5, 1.0...)
                if (scaleMax === 3) {
                  textVal = val.toFixed(1);
                  if (val === 0) textVal = '0'; // Keep 0 as 0
                }
                
                ticks.push(<text key={`txt-${i}`} x={centerX + (rBase + 35) * Math.sin(angleRad)} y={centerY - (rBase + 35) * Math.cos(angleRad)} fill="#0f172a" fontSize="16" fontWeight="900" textAnchor="middle" dominantBaseline="middle">{textVal}</text>);
              }
            }
          }
          return <g>{ticks}</g>;
        });

        const VirtualElectricalLab = () => {
          const [components, setComponents] = useState([]);
          const [wires, setWires] = useState([]);
          
          const [wireDraft, setWireDraft] = useState(null);
          const [selectedTerminal, setSelectedTerminal] = useState(null);
          const [wireColor, setWireColor] = useState('#ef4444');
          const [zoom, setZoom] = useState(window.innerWidth < 768 ? 0.6 : 0.85);
          const [pan, setPan] = useState({ x: 0, y: 0 });
          
          const [draggingId, setDraggingId] = useState(null);
          const [panning, setPanning] = useState(false);
          const dragOffset = useRef({ x: 0, y: 0 });
          
          const benchRef = useRef(null);
          const needleGroupRefs = useRef({});
          const needlePhysics = useRef({});

          const getCoords = (e) => {
            if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            if (e.changedTouches && e.changedTouches.length > 0) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
            return { x: e.clientX, y: e.clientY };
          };

          const getWorkspaceCoords = useCallback((e) => {
            if (!benchRef.current) return { x: 0, y: 0 };
            const rect = benchRef.current.getBoundingClientRect();
            const coords = getCoords(e);
            
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            
            const dx = (coords.x - cx) / zoom;
            const dy = (coords.y - cy) / zoom;
            
            return { x: dx - pan.x, y: dy - pan.y };
          }, [zoom, pan]);

          const terminals = useMemo(() => {
            const t = {};
            components.forEach(comp => {
              if (comp.type === 'supply') {
                t[`${comp.id}-pos`] = { x: comp.x + 70, y: comp.y + 266, label: '(+)', color: '#ef4444' };
                t[`${comp.id}-neg`] = { x: comp.x + 170, y: comp.y + 266, label: '(-)', color: '#0f172a' };
              } else if (comp.type === 'switchBox') {
                t[`${comp.id}-in`] = { x: comp.x + 40, y: comp.y + 166, label: 'IN', color: '#eab308' };
                t[`${comp.id}-out`] = { x: comp.x + 100, y: comp.y + 166, label: 'OUT', color: '#eab308' };
              } else if (comp.type === 'load') {
                t[`${comp.id}-top`] = { x: comp.x + 40, y: comp.y + 250, label: 'IN', color: '#3b82f6' };
                t[`${comp.id}-bot`] = { x: comp.x + 120, y: comp.y + 250, label: 'OUT', color: '#3b82f6' };
              } else if (comp.type === 'meter') {
                t[`${comp.id}-red`] = { x: comp.x + 120, y: comp.y + 396, label: '(+)', color: '#ef4444' };
                t[`${comp.id}-com`] = { x: comp.x + 240, y: comp.y + 396, label: 'COM', color: '#0f172a' };
              }
            });
            return t;
          }, [components]);

          const physicsDeps = useMemo(() => {
            return components.map(c => `${c.id}_${c.type}_${c.voltage}_${c.closed}_${c.resistance}_${c.instType}_${c.rangeIdx}`).join('|') + '||' + wires.map(w => `${w.from}_${w.to}`).join('|');
          }, [components, wires]);

          const addComponent = (type) => {
            const id = `${type}-${Date.now()}`;
            const spawnX = -pan.x + (Math.random() * 100 - 50);
            const spawnY = -pan.y + (Math.random() * 100 - 50);
            
            let newComp = { id, type, x: spawnX, y: spawnY };
            if (type === 'supply') newComp.voltage = 12;
            if (type === 'switchBox') newComp.closed = true;
            if (type === 'load') newComp.resistance = 12;
            if (type === 'ammeter') { newComp.type = 'meter'; newComp.instType = 'ammeter'; newComp.rangeIdx = 0; }
            if (type === 'voltmeter') { newComp.type = 'meter'; newComp.instType = 'voltmeter'; newComp.rangeIdx = 1; }
            
            setComponents([...components, newComp]);
          };

          const removeComponent = (id) => {
            setComponents(components.filter(c => c.id !== id));
            setWires(wires.filter(w => !w.from.startsWith(id) && !w.to.startsWith(id)));
          };

          const handleTerminalDown = (termId, e) => {
            e.stopPropagation();
            if (selectedTerminal && selectedTerminal !== termId) {
              addWire(selectedTerminal, termId);
              setSelectedTerminal(null);
              setWireDraft(null);
              return;
            }
            const coords = getWorkspaceCoords(e);
            setSelectedTerminal(termId);
            setWireDraft({ from: termId, x: coords.x, y: coords.y });
          };

          const addWire = (from, to) => {
            if (from === to) return;
            setWires(prev => {
              if (prev.some(w => (w.from === from && w.to === to) || (w.from === to && w.to === from))) return prev;
              return [...prev, { id: `w-${Date.now()}`, from, to, color: wireColor }];
            });
          };

          const startDrag = (id, e) => {
            if (e.target.closest('input') || e.target.closest('button')) return;
            e.stopPropagation();
            const coords = getWorkspaceCoords(e);
            const comp = components.find(c => c.id === id);
            if (comp) {
              dragOffset.current = { x: coords.x - comp.x, y: coords.y - comp.y };
              setDraggingId(id);
            }
          };

          const startPan = (e) => {
            if (e.target.closest('.component-card') || e.target.closest('.terminal-point')) return;
            const coords = getCoords(e);
            dragOffset.current = { x: coords.x - pan.x * zoom, y: coords.y - pan.y * zoom };
            setPanning(true);
          };

          useEffect(() => {
            let rafId = null;

            const handleMove = (e) => {
              if (!draggingId && !wireDraft && !panning) return;
              if (e.cancelable) e.preventDefault(); 
              
              const screenCoords = getCoords(e);
              const wsCoords = getWorkspaceCoords(e);

              if (rafId) cancelAnimationFrame(rafId);
              rafId = requestAnimationFrame(() => {
                if (panning) {
                  setPan({ 
                    x: (screenCoords.x - dragOffset.current.x) / zoom, 
                    y: (screenCoords.y - dragOffset.current.y) / zoom 
                  });
                } else if (draggingId) {
                  setComponents(prev => prev.map(c => c.id === draggingId ? {
                    ...c, x: wsCoords.x - dragOffset.current.x, y: wsCoords.y - dragOffset.current.y
                  } : c));
                } else if (wireDraft) {
                  setWireDraft(prev => prev ? { ...prev, x: wsCoords.x, y: wsCoords.y } : null);
                }
              });
            };

            const handleUp = (e) => {
              if (rafId) cancelAnimationFrame(rafId);
              setPanning(false);
              setDraggingId(null);
              
              if (wireDraft) {
                const wsCoords = getWorkspaceCoords(e);
                let hitTerm = null;
                Object.entries(terminals).forEach(([id, pt]) => {
                  if (Math.hypot(pt.x - wsCoords.x, pt.y - wsCoords.y) < 40) hitTerm = id;
                });
                if (hitTerm && hitTerm !== wireDraft.from) {
                  addWire(wireDraft.from, hitTerm);
                }
                setWireDraft(null);
                setSelectedTerminal(null);
              }
            };

            window.addEventListener('mousemove', handleMove, { passive: false });
            window.addEventListener('mouseup', handleUp);
            window.addEventListener('touchmove', handleMove, { passive: false });
            window.addEventListener('touchend', handleUp);
            return () => {
              if (rafId) cancelAnimationFrame(rafId);
              window.removeEventListener('mousemove', handleMove);
              window.removeEventListener('mouseup', handleUp);
              window.removeEventListener('touchmove', handleMove);
              window.removeEventListener('touchend', handleUp);
            };
          }, [draggingId, wireDraft, panning, zoom, pan, terminals]);

          const circuitAnalysis = useMemo(() => {
            const termIds = Object.keys(terminals);
            const parent = {};
            const getRoot = (i) => parent[i] === i ? i : (parent[i] = getRoot(parent[i]));
            termIds.forEach(t => parent[t] = t);
            wires.forEach(w => {
              const r1 = getRoot(w.from), r2 = getRoot(w.to);
              if (r1 !== r2) parent[r1] = r2;
            });

            const uniqueNodes = Array.from(new Set(termIds.map(getRoot)));
            const nodeMap = {};
            uniqueNodes.forEach((root, idx) => nodeMap[root] = idx);
            const N = uniqueNodes.length;

            const solveMatrix = (isOhmmeterTest = false, ohmRed = null, ohmCom = null) => {
              if (N <= 1) return { getV: () => 0 };
              const G = Array(N).fill(0).map(() => Array(N).fill(0));
              const B = Array(N).fill(0);

              const addG = (n1, n2, g) => {
                G[n1][n1] += g; G[n2][n2] += g;
                G[n1][n2] -= g; G[n2][n1] -= g;
              };

              components.forEach(c => {
                if (c.type === 'supply') {
                  const n1 = nodeMap[getRoot(`${c.id}-pos`)];
                  const n2 = nodeMap[getRoot(`${c.id}-neg`)];
                  if (n1 === n2) return;
                  const Rs = 1e-4;
                  addG(n1, n2, 1/Rs);
                  if (!isOhmmeterTest) {
                    B[n1] += c.voltage / Rs;
                    B[n2] -= c.voltage / Rs;
                  }
                } else if (c.type === 'load') {
                  const n1 = nodeMap[getRoot(`${c.id}-top`)];
                  const n2 = nodeMap[getRoot(`${c.id}-bot`)];
                  if (n1 !== n2) addG(n1, n2, 1 / Math.max(0.1, c.resistance));
                } else if (c.type === 'switchBox') {
                  const n1 = nodeMap[getRoot(`${c.id}-in`)];
                  const n2 = nodeMap[getRoot(`${c.id}-out`)];
                  if (n1 !== n2) addG(n1, n2, c.closed ? 1e4 : 1e-9);
                } else if (c.type === 'meter') {
                  const n1 = nodeMap[getRoot(`${c.id}-red`)];
                  const n2 = nodeMap[getRoot(`${c.id}-com`)];
                  if (n1 === n2) return;
                  if (c.instType === 'voltmeter') addG(n1, n2, 1e-7);
                  else if (c.instType === 'ammeter') addG(n1, n2, 1e4);
                }
              });

              if (isOhmmeterTest && ohmRed && ohmCom) {
                const n1 = nodeMap[getRoot(ohmRed)];
                const n2 = nodeMap[getRoot(ohmCom)];
                if (n1 !== n2) { B[n1] += 1; B[n2] -= 1; }
              }

              const N_red = N - 1;
              const A = Array(N_red).fill(0).map(() => Array(N_red).fill(0));
              const X = Array(N_red).fill(0);
              for (let i = 1; i < N; i++) {
                X[i-1] = B[i];
                for (let j = 1; j < N; j++) A[i-1][j-1] = G[i][j];
              }

              for (let i = 0; i < N_red; i++) {
                let pivot = i;
                for (let k = i+1; k < N_red; k++) if (Math.abs(A[k][i]) > Math.abs(A[pivot][i])) pivot = k;
                if (Math.abs(A[pivot][i]) < 1e-12) continue;
                [A[i], A[pivot]] = [A[pivot], A[i]];
                [X[i], X[pivot]] = [X[pivot], X[i]];
                
                for (let k = i+1; k < N_red; k++) {
                  let factor = A[k][i] / A[i][i];
                  for (let j = i; j < N_red; j++) A[k][j] -= factor * A[i][j];
                  X[k] -= factor * X[i];
                }
              }

              const V_red = Array(N_red).fill(0);
              for (let i = N_red - 1; i >= 0; i--) {
                let sum = 0;
                for (let k = i+1; k < N_red; k++) sum += A[i][k] * V_red[k];
                V_red[i] = (X[i] - sum) / A[i][i];
                if (!isFinite(V_red[i])) V_red[i] = 0;
              }

              const V = [0, ...V_red];
              return { getV: (t) => V[nodeMap[getRoot(t)]] || 0 };
            };

            const normalSim = solveMatrix();
            const results = { loads: {}, meters: {}, isPowered: false };
            
            components.forEach(c => {
              if (c.type === 'supply' && c.voltage > 0) {
                if (Math.abs(normalSim.getV(`${c.id}-pos`) - normalSim.getV(`${c.id}-neg`)) > 0.1) results.isPowered = true;
              }
            });

            components.forEach(c => {
              if (c.type === 'load') {
                const vDrop = Math.abs(normalSim.getV(`${c.id}-top`) - normalSim.getV(`${c.id}-bot`));
                const iLoad = vDrop / Math.max(0.1, c.resistance); // คำนวณกระแส (I = V/R)
                const pLoad = vDrop * iLoad; // กำลังไฟฟ้า P = V * I
                // ความสว่างอิงจากกำลังไฟฟ้า (สมมติให้ 12W คือสว่าง 100%)
                results.loads[c.id] = { vDrop, current: iLoad, pLoad, glow: Math.min(100, Math.max(0, (pLoad / 12) * 100)) };
              } else if (c.type === 'meter') {
                const vRed = normalSim.getV(`${c.id}-red`);
                const vCom = normalSim.getV(`${c.id}-com`);
                const vDiff = vRed - vCom; // Allows negative values

                if (c.instType === 'voltmeter') {
                  if (Math.abs(vDiff) < 1e-3) results.meters[c.id] = { val: 0, err: '---' };
                  else results.meters[c.id] = { val: vDiff, err: null }; 
                } else if (c.instType === 'ammeter') {
                  const iAm = vDiff / 1e-4; 
                  if (Math.abs(iAm) < 1e-4) results.meters[c.id] = { val: 0, err: '---' };
                  else if (Math.abs(iAm) > 600) results.meters[c.id] = { val: 0, err: 'SHORT' }; 
                  else results.meters[c.id] = { val: iAm, err: null };
                } else if (c.instType === 'ohmmeter') {
                  if (Math.abs(vDiff) > 0.1) {
                    results.meters[c.id] = { val: Infinity, err: 'LIVE !' }; 
                  } else {
                    const ohmSim = solveMatrix(true, `${c.id}-red`, `${c.id}-com`);
                    const rV = ohmSim.getV(`${c.id}-red`);
                    const cV = ohmSim.getV(`${c.id}-com`);
                    const R = Math.abs(rV - cV);
                    if (R > 1e6 || R < 1e-3) results.meters[c.id] = { val: Infinity, err: 'O.L' };
                    else results.meters[c.id] = { val: R, err: null };
                  }
                }
              }
            });

            return results;
          // eslint-disable-next-line react-hooks/exhaustive-deps
          }, [physicsDeps]); 

          const componentsRef = useRef(components);
          componentsRef.current = components;

          useEffect(() => {
            let animId;
            let lastTime = performance.now();
            
            const animate = (time) => {
              const dt = Math.min((time - lastTime) / 1000, 0.05); 
              lastTime = time;

              componentsRef.current.forEach(c => {
                if (c.type !== 'meter') return;
                const mRes = circuitAnalysis.meters[c.id] || { val: 0, err: '---' };
                const ranges = c.instType === 'ammeter' ? AMMETER_RANGES : (c.instType === 'voltmeter' ? VOLTMETER_RANGES : OHMMETER_RANGES);
                const curRange = ranges[c.rangeIdx || 0];

                let target = 0;
                
                if (mRes.err === 'SHORT' || mRes.err === 'LIVE !') {

                  node.setAttribute('transform', `rotate(${angle.toFixed(2)}, 300, 320)`);
                }
              });
              animId = requestAnimationFrame(animate);
            };
            
            animId = requestAnimationFrame(animate);

                                </span>
                              </div>
                              <div className="flex-1 bg-[#9ca3af] p-2 rounded-xl flex flex-wrap gap-1 border border-[#6b7280] shadow-inner">
                                {ranges.map((r, rIdx) => (
                                  <button key={rIdx} onClick={() => setComponents(components.map(c => c.id === comp.id ? { ...c, rangeIdx: rIdx } : c))}
                                    className={`flex-1 min-w-[30%] py-1.5 rounded-md text-[10px] font-black border-b-2 transition-all ${comp.rangeIdx === rIdx ? 'bg-[#3b82f6] text-white border-[#1d4ed8] translate-y-0.5' : 'bg-[#e5e7eb] text-[#374151] border-[#9ca3af] pb-2'}`}
                                  >{r.label}</button>
                                ))}
                              </div>
                            </div>
                          </div>
                        );
                      }
                      return null;
                    })}
                  </div>
                </div>
              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<VirtualElectricalLab />);
    </script>
</body>
</html>
